<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Absensi — KP2A Kintamani</title>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5; color: #222; padding-bottom: 80px; }

  header {
    background: linear-gradient(135deg, #1a5276, #2e86c1);
    color: #fff; padding: 14px 20px;
    position: sticky; top: 0; z-index: 10;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
    display: flex; align-items: center; gap: 10px;
  }
  header .back { color: #fff; text-decoration: none; font-size: 16pt; padding: 0 6px; }
  header h1 { font-size: 14pt; letter-spacing: 0.5px; flex: 1; }
  header small { font-size: 8pt; opacity: 0.85; display: block; }
  header .tgl { font-size: 8pt; opacity: 0.75; margin-top: 2px; }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 10px; }
  .stat { background: #fff; border-radius: 8px; padding: 8px 4px; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .stat .num { font-size: 15pt; font-weight: 700; color: #1a5276; }
  .stat .lbl { font-size: 7pt; color: #888; text-transform: uppercase; }
  .stat.hadir .num { color: #27ae60; }
  .stat.sakit .num { color: #e74c3c; }
  .stat.absen .num { color: #e67e22; }

  .scan-area { padding: 0 10px 10px; }
  .btn-scan {
    width: 100%; background: #1a5276; color: #fff;
    border: none; padding: 13px; border-radius: 8px;
    font-size: 11pt; font-weight: 600; cursor: pointer;
    box-shadow: 0 2px 8px rgba(26,82,118,.3);
  }
  .btn-scan:active { transform: scale(0.98); }
  .btn-scan.stop { background: #c0392b; }

  #reader { width: 100%; max-width: 500px; margin: 0 auto 10px; border-radius: 8px; overflow: hidden; display: none; }
  #reader.active { display: block; }

  .manual { padding: 0 10px 10px; display: flex; gap: 8px; }
  .manual input {
    flex: 1; padding: 10px 12px; border: 1px solid #ccc;
    border-radius: 8px; font-size: 10pt; font-family: 'Courier New', monospace;
  }
  .manual button {
    background: #2e86c1; color: #fff; border: none;
    padding: 10px 16px; border-radius: 8px; font-size: 10pt; font-weight: 600; cursor: pointer;
  }

  .list-section { padding: 0 10px; }
  .list-title {
    font-size: 10pt; font-weight: 700; color: #1a5276;
    margin: 6px 0 8px; display: flex; justify-content: space-between; align-items: center;
  }
  .list-title .actions button {
    background: #fff; border: 1px solid #ccc; padding: 5px 10px;
    border-radius: 6px; font-size: 8pt; cursor: pointer; margin-left: 5px; color: #555;
  }
  .list-title .actions button.danger { color: #c0392b; border-color: #e6b0aa; }

  #daftarSiswa { list-style: none; }
  #daftarSiswa li {
    background: #fff; border-radius: 8px; padding: 10px 12px;
    margin-bottom: 6px; display: flex; align-items: center; gap: 10px;
    box-shadow: 0 1px 3px rgba(0,0,0,.05);
  }
  #daftarSiswa li .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 11pt; color: #fff; flex-shrink: 0;
  }
  .avatar.hadir { background: #27ae60; }
  .avatar.sakit { background: #e74c3c; }
  .avatar.keluarga { background: #3498db; }
  .avatar.lain { background: #9b59b6; }
  .avatar.tanpa { background: #e67e22; }
  .avatar.belum { background: #bdc3c7; }

  #daftarSiswa li .info { flex: 1; min-width: 0; }
  #daftarSiswa li .info .nama {
    font-size: 9.5pt; font-weight: 600; color: #222;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #daftarSiswa li .info .kode {
    font-size: 7.5pt; font-family: 'Courier New', monospace; color: #888;
  }
  #daftarSiswa li .status { font-size: 8pt; font-weight: 600; text-align: right; white-space: nowrap; }
  .status.hadir { color: #27ae60; }
  .status.sakit { color: #e74c3c; }
  .status.keluarga { color: #3498db; }
  .status.lain { color: #9b59b6; }
  .status.tanpa { color: #e67e22; }
  .status.belum { color: #999; }

  #daftarSiswa li .mark {
    background: none; border: 1px solid #ddd; border-radius: 6px;
    padding: 4px 8px; font-size: 7.5pt; cursor: pointer; color: #555;
  }

  #toast {
    position: fixed; bottom: 100px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #27ae60; color: #fff; padding: 12px 20px;
    border-radius: 8px; font-size: 10pt; font-weight: 600;
    opacity: 0; transition: all 0.3s ease; z-index: 100;
    pointer-events: none; max-width: 90%; text-align: center;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.error { background: #c0392b; }
  #toast.warning { background: #e67e22; }

  .modal {
    position: fixed; inset: 0; background: rgba(0,0,0,.6);
    display: none; align-items: center; justify-content: center;
    padding: 20px; z-index: 30;
  }
  .modal.active { display: flex; }
  .modal-content {
    background: #fff; border-radius: 12px; padding: 20px;
    width: 100%; max-width: 400px;
  }
  .modal-content h3 { font-size: 12pt; color: #1a5276; margin-bottom: 4px; }
  .modal-content p { font-size: 9pt; color: #666; margin-bottom: 14px; }
  .modal-content .status-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  }
  .modal-content .status-grid button {
    padding: 12px; border-radius: 8px; border: 1px solid #ddd;
    background: #fff; font-size: 10pt; font-weight: 600; cursor: pointer;
    text-align: left;
  }
  .modal-content .status-grid button:hover { background: #f5f5f5; }
  .modal-content .status-grid button[data-kode="h"] { border-color: #27ae60; color: #27ae60; }
  .modal-content .status-grid button[data-kode="s"] { border-color: #e74c3c; color: #e74c3c; }
  .modal-content .status-grid button[data-kode="k"] { border-color: #3498db; color: #3498db; }
  .modal-content .status-grid button[data-kode="l"] { border-color: #9b59b6; color: #9b59b6; }
  .modal-content .status-grid button[data-kode="t"] { border-color: #e67e22; color: #e67e22; }
  .modal-content .cancel {
    margin-top: 12px; width: 100%; padding: 10px;
    background: #eee; border: none; border-radius: 6px;
    font-size: 9pt; cursor: pointer; color: #555;
  }
</style>
</head>
<body>

<header>
  <a href="index.html" class="back">←</a>
  <div style="flex:1">
    <h1 id="judulKelas">Memuat...</h1>
    <small id="namaTutor"></small>
    <div class="tgl" id="tanggalHariIni"></div>
  </div>
</header>

<div class="stats">
  <div class="stat hadir"><div class="num" id="statH">0</div><div class="lbl">Hadir</div></div>
  <div class="stat sakit"><div class="num" id="statS">0</div><div class="lbl">Sakit</div></div>
  <div class="stat absen"><div class="num" id="statA">0</div><div class="lbl">Izin/Absen</div></div>
  <div class="stat"><div class="num" id="statB">0</div><div class="lbl">Belum</div></div>
</div>

<div class="scan-area">
  <button class="btn-scan" id="btnScan" onclick="toggleScan()">📷 Mulai Scan QR</button>
</div>

<div id="reader"></div>

<div class="manual">
  <input type="text" id="manualInput" placeholder="Ketik kode siswa..." autocomplete="off">
  <button onclick="submitManual()">✓</button>
</div>

<div class="list-section">
  <div class="list-title">
    <span id="labelDaftar">Daftar Siswa</span>
    <span class="actions">
      <button onclick="muatDariSupabase()">🔄 Refresh</button>
      <button onclick="exportCSV()">📤 CSV</button>
      <button class="danger" onclick="resetHariIni()">🔄 Reset</button>
    </span>
  </div>
  <ul id="daftarSiswa"></ul>
</div>

<div class="modal" id="modalStatus">
  <div class="modal-content">
    <h3 id="modalNama">—</h3>
    <p>Tandai status kehadiran:</p>
    <div class="status-grid">
      <button data-kode="h" onclick="setStatus('h')">✅ Hadir</button>
      <button data-kode="s" onclick="setStatus('s')">🤒 Sakit</button>
      <button data-kode="k" onclick="setStatus('k')">👨‍👩‍👧 Keluarga</button>
      <button data-kode="l" onclick="setStatus('l')">📝 Lain-lain</button>
      <button data-kode="t" onclick="setStatus('t')">❓ Tanpa Ket.</button>
    </div>
    <button class="cancel" onclick="closeModal()">Batal</button>
  </div>
</div>

<div id="toast"></div>

<script src="data-siswa.js"></script>
<script>
  // ============ KONFIGURASI SUPABASE ============
  const SUPABASE_URL = "https://btuhrtrurtugcdjukglv.supabase.co";
  const SUPABASE_KEY = "sb_publishable_yOHWxYsVz6Y3AoKMcaAi-Q_qMD44coe";

  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // ============ AMBIL KELAS DARI URL ============
  const params = new URLSearchParams(window.location.search);
  const kelas = params.get("kelas");

  if (!kelas || !DATA_KELAS[kelas]) {
    document.body.innerHTML = "<h2 style='padding:30px;text-align:center'>Kelas tidak ditemukan. <a href='index.html'>Kembali</a></h2>";
    throw new Error("Kelas tidak valid");
  }

  const infoKelas = DATA_KELAS[kelas];
  const siswaList = infoKelas.siswa;

  document.getElementById("judulKelas").textContent = kelas;
  document.getElementById("namaTutor").textContent = "Tutor: " + infoKelas.tutor;

  const today = new Date();
  document.getElementById("tanggalHariIni").textContent =
    today.toLocaleDateString("id-ID", { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

  // ============ STORAGE LOKAL (CACHE) ============
  const KEY = "kp2a_absensi_" + kelas;

  function todayKey() {
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }

  let semuaAbsensi = {};
  try {
    semuaAbsensi = JSON.parse(localStorage.getItem(KEY) || "{}");
  } catch(e) { semuaAbsensi = {}; }

  function getHariIni() {
    return semuaAbsensi[todayKey()] || {};
  }

  function simpanLokal() {
    localStorage.setItem(KEY, JSON.stringify(semuaAbsensi));
  }

  // ============ MUAT DARI SUPABASE (LOAD AWAL) ============
  async function muatDariSupabase() {
    showToast("Memuat data dari server...", "warning");
    try {
      const { data: rows, error } = await supabaseClient
        .from('absensi')
        .select('*')
        .eq('kelas', kelas)
        .eq('tanggal', todayKey());

      if (error) {
        console.error("Supabase load error:", error);
        showToast("⚠️ Gagal memuat dari server", "error");
        return;
      }

      semuaAbsensi[todayKey()] = {};
      if (rows) {
        rows.forEach(r => {
          semuaAbsensi[todayKey()][r.kode_siswa] = r.status;
        });
      }
      simpanLokal();
      render();
      showToast(`✅ Data dimuat: ${rows ? rows.length : 0} catatan`, "success");
    } catch (err) {
      console.error("Supabase load exception:", err);
      showToast("⚠️ Gagal memuat dari server", "error");
    }
  }

  // ============ SINKRON KE SUPABASE ============
  async function simpanKeSupabase(kodeSiswa, namaSiswa, status) {
    try {
      const { error } = await supabaseClient
        .from('absensi')
        .upsert({
          tanggal: todayKey(),
          kelas: kelas,
          kode_siswa: kodeSiswa,
          nama_siswa: namaSiswa,
          status: status
        }, {
          onConflict: 'tanggal,kelas,kode_siswa'
        });

      if (error) {
        console.error("Supabase error:", error);
        showToast("⚠️ Gagal sinkron ke server", "error");
      }
    } catch (err) {
      console.error("Supabase exception:", err);
      showToast("⚠️ Gagal sinkron ke server", "error");
    }
  }

  // ============ RENDER ============
  function render() {
    const hariIni = getHariIni();
    const total = siswaList.length;

    let h = 0, s = 0, a = 0, b = 0;
    siswaList.forEach(siswa => {
      const st = hariIni[siswa.kode];
      if (st === "h") h++;
      else if (st === "s") s++;
      else if (st === "k" || st === "l" || st === "t") a++;
      else b++;
    });

    document.getElementById("statH").textContent = h;
    document.getElementById("statS").textContent = s;
    document.getElementById("statA").textContent = a;
    document.getElementById("statB").textContent = b;

    const ul = document.getElementById("daftarSiswa");
    const sorted = [...siswaList].sort((x, y) => {
      const sx = hariIni[x.kode] || "";
      const sy = hariIni[y.kode] || "";
      if (sx && !sy) return -1;
      if (!sx && sy) return 1;
      return x.nama.localeCompare(y.nama);
    });

    ul.innerHTML = sorted.map(siswa => {
      const st = hariIni[siswa.kode];
      let avatarClass = "belum", statusText = "Belum", statusClass = "belum";
      if (st === "h") { avatarClass = "hadir"; statusText = "Hadir"; statusClass = "hadir"; }
      else if (st === "s") { avatarClass = "sakit"; statusText = "Sakit"; statusClass = "sakit"; }
      else if (st === "k") { avatarClass = "keluarga"; statusText = "Keluarga"; statusClass = "keluarga"; }
      else if (st === "l") { avatarClass = "lain"; statusText = "Lain-lain"; statusClass = "lain"; }
      else if (st === "t") { avatarClass = "tanpa"; statusText = "Tanpa Ket."; statusClass = "tanpa"; }

      return `
        <li>
          <div class="avatar ${avatarClass}">${(siswa.nama)[0].toUpperCase()}</div>
          <div class="info">
            <div class="nama">${siswa.nama}</div>
            <div class="kode">${siswa.kode}</div>
          </div>
          <div class="status ${statusClass}">${statusText}</div>
          <button class="mark" onclick="openModal('${siswa.kode}', '${siswa.nama.replace(/'/g, "\\'")}')">Ubah</button>
        </li>
      `;
    }).join("");
  }

  // ============ SCAN ============
  let html5QrCode = null, scanning = false;

  function toggleScan() { if (scanning) stopScan(); else startScan(); }

  function startScan() {
    html5QrCode = new Html5Qrcode("reader");
    document.getElementById("reader").classList.add("active");
    html5QrCode.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 250, height: 250 } },
      onScanSuccess,
      () => {}
    ).then(() => {
      scanning = true;
      const btn = document.getElementById("btnScan");
      btn.textContent = "⏹ Hentikan Scan";
      btn.classList.add("stop");
    }).catch(err => showToast("Gagal buka kamera: " + err, "error"));
  }

  function stopScan() {
    if (html5QrCode) {
      html5QrCode.stop().then(() => { html5QrCode.clear(); html5QrCode = null; }).catch(() => {});
    }
    scanning = false;
    document.getElementById("reader").classList.remove("active");
    const btn = document.getElementById("btnScan");
    btn.textContent = "📷 Mulai Scan QR";
    btn.classList.remove("stop");
  }

  function onScanSuccess(decodedText) {
    prosesAbsen(decodedText.trim());
  }

  // ============ PROSES ABSEN ============
  function prosesAbsen(kode) {
    kode = kode.trim();
    if (!kode) return;

    const siswa = siswaList.find(s => s.kode === kode);
    if (!siswa) {
      showToast(`❌ Kode tidak terdaftar di ${kelas}: ${kode}`, "error");
      return;
    }

    const hariIni = getHariIni();
    if (hariIni[kode]) {
      const label = { h: "Hadir", s: "Sakit", k: "Keluarga", l: "Lain-lain", t: "Tanpa Ket." };
      showToast(`⚠️ ${siswa.nama} sudah dicatat: ${label[hariIni[kode]]}`, "warning");
      return;
    }

    if (!semuaAbsensi[todayKey()]) semuaAbsensi[todayKey()] = {};
    semuaAbsensi[todayKey()][kode] = "h";
    simpanLokal();
    render();
    showToast(`✅ ${siswa.nama} — Hadir`, "success");
    beep();

    simpanKeSupabase(kode, siswa.nama, "h");
  }

  function submitManual() {
    const input = document.getElementById("manualInput");
    prosesAbsen(input.value);
    input.value = "";
    input.focus();
  }

  document.getElementById("manualInput").addEventListener("keypress", e => {
    if (e.key === "Enter") submitManual();
  });

  // ============ MODAL STATUS ============
  let kodeAktif = null;

  function openModal(kode, nama) {
    kodeAktif = kode;
    document.getElementById("modalNama").textContent = nama;
    document.getElementById("modalStatus").classList.add("active");
  }

  function closeModal() {
    kodeAktif = null;
    document.getElementById("modalStatus").classList.remove("active");
  }

  // ============ SET STATUS (SUDAH DIPERBAIKI) ============
  function setStatus(kode) {
    if (!kodeAktif) return;

    // Simpan siswa DULU sebelum closeModal menghapus kodeAktif
    const siswa = siswaList.find(s => s.kode === kodeAktif);

    if (!semuaAbsensi[todayKey()]) semuaAbsensi[todayKey()] = {};
    semuaAbsensi[todayKey()][kodeAktif] = kode;
    simpanLokal();
    render();
    closeModal();

    const label = { h: "Hadir", s: "Sakit", k: "Keluarga", l: "Lain-lain", t: "Tanpa Ket." };
    showToast(`✅ Status diubah: ${label[kode]}`, "success");

    // Baru kirim ke Supabase, pakai data siswa yang sudah disimpan tadi
    if (siswa) simpanKeSupabase(siswa.kode, siswa.nama, kode);
  }

  // ============ BEEP ============
  function beep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.15, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
      osc.start(); osc.stop(ctx.currentTime + 0.15);
    } catch(e) {}
  }

  // ============ TOAST ============
  let toastTimer;
  function showToast(msg, type = "success") {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.className = "show " + (type === "success" ? "" : type);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.className = ""; }, 2500);
  }

  // ============ EXPORT CSV ============
  function exportCSV() {
    const hariIni = getHariIni();
    if (Object.keys(hariIni).length === 0) {
      showToast("Belum ada data untuk diexport", "warning");
      return;
    }
    const label = { h: "Hadir", s: "Sakit", k: "Keluarga", l: "Lain-lain", t: "Tanpa Ket." };
    let csv = "No,Nama,Kode,Status\n";
    siswaList.forEach((s, i) => {
      const st = hariIni[s.kode] || "-";
      csv += `${i+1},"${s.nama}",${s.kode},${label[st] || "Belum"}\n`;
    });
    const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8;" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `absensi_${kelas}_${todayKey()}.csv`;
    link.click();
    showToast("📤 CSV berhasil diunduh", "success");
  }

  // ============ RESET ============
  function resetHariIni() {
    if (!confirm(`Reset absensi ${kelas} hari ini? (Data di Supabase tidak terhapus)`)) return;
    delete semuaAbsensi[todayKey()];
    simpanLokal();
    render();
    showToast("Data lokal hari ini direset", "success");
  }

  // ============ START ============
  render();
  muatDariSupabase();

  // ============ REALTIME LISTENER ============
  supabaseClient
    .channel('absensi-changes-' + kelas)
    .on(
      'postgres_changes',
      {
        event: '*',
        schema: 'public',
        table: 'absensi',
        filter: `kelas=eq.${kelas}`
      },
      (payload) => {
        const baru = payload.new;
        if (baru && baru.tanggal === todayKey()) {
          if (!semuaAbsensi[todayKey()]) semuaAbsensi[todayKey()] = {};
          semuaAbsensi[todayKey()][baru.kode_siswa] = baru.status;
          simpanLokal();
          render();
          console.log("Realtime update:", baru.nama_siswa, "->", baru.status);
        }
      }
    )
    .subscribe((status) => {
      console.log("Realtime status:", status);
    });
</script>

</body>
</html>
